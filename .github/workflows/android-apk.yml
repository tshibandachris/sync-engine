name: Android foundation validation

on:
  push:
    branches: [feat/android-foundation]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    name: Android API ${{ matrix.api-level }} ${{ matrix.memory-profile }} - SQLite and ES256
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - api-level: 33
            system-image: google_apis
            memory-profile: standard
          - api-level: 34
            system-image: google_apis
            memory-profile: standard
          - api-level: 35
            system-image: google_apis
            memory-profile: standard
          - api-level: 36
            system-image: google_apis
            memory-profile: standard
          - api-level: 35
            system-image: google_apis_ps16k
            memory-profile: 16kb
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web application
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Register native plugin and instrumentation tests
        run: node scripts/prepare-android.mjs
      - name: Sync Capacitor plugins
        run: npx cap sync android
      - name: Run Android ${{ matrix.api-level }} instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.system-image }}
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: "-no-window -no-audio -no-boot-anim -no-snapshot-load -no-snapshot-save -gpu swiftshader_indirect"
          working-directory: android-app/android
          script: |
            set -eu
            ./gradlew clean connectedDebugAndroidTest assembleDebug --no-daemon --max-workers=1 --stacktrace --info
            if [ "${{ matrix.memory-profile }}" = "16kb" ]; then
              page_size="$(adb shell getconf PAGE_SIZE | tr -d '\r')"
              echo "Emulator page size: $page_size"
              test "$page_size" = "16384"
            fi
            zipalign="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
            test -n "$zipalign"
            "$zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-gestion-android-api-${{ matrix.api-level }}-${{ matrix.memory-profile }}-debug
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
