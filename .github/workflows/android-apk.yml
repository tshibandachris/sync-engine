name: Android foundation validation

on:
  push:
    branches: [feat/android-foundation]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    name: Android 13 emulator — SQLite and ES256
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools,platforms;android-33,build-tools;35.0.0,emulator,system-images;android-33;google_apis;x86_64'
          accept-android-sdk-licenses: true
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web application
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Register native plugin and instrumentation tests
        run: node scripts/prepare-android.mjs
      - name: Sync Capacitor plugins
        run: npx cap sync android
      - name: Run Android 13 instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          working-directory: android-app/android
          script: ./gradlew --no-daemon connectedDebugAndroidTest assembleDebug
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-gestion-android-debug
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
