name: POS migration smoke test

on:
  push:
    branches: [feature/pos-domain-schema]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pos-migrations:
    name: Apply migrations 001-040 through the production runner and verify replay safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sync_engine_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sync_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run production migration runner twice against an empty database
        env:
          DB_HOST: localhost
          DB_NAME: sync_engine_test
          DB_USER: postgres
          MIGRATIONS_DIR: migrations
          PGPASSWORD: postgres
          SYNC_APP_PASSWORD: sync_app_test_password
          DEVICE_ENROLLMENT_PASSWORD: enrollment_test_password
          DEVICE_ADMIN_PASSWORD: admin_test_password
          MAINTENANCE_PASSWORD: maintenance_test_password
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: sync_engine_test
        run: |
          set -euo pipefail
          sh scripts/migrate.sh
          sh scripts/migrate.sh
          applied="$(psql -v ON_ERROR_STOP=1 -tA -c 'SELECT count(*) FROM public.schema_migrations')"
          test "$applied" = "40"
          echo "Verified $applied migrations and an idempotent second run."
          sh test/migration-runner-recovery.sh
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run integration and regression tests
        run: npm test -- --reporter=verbose
      - name: Verify POS sync triggers and tenant RLS
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: sync_engine_test
        run: psql -v ON_ERROR_STOP=1 -f test/sql/pos-migrations-smoke.sql
