name: CI

on:
  push:
    branches: [main, deploy/render-clean]
  pull_request:
    branches: [main, validation/full-device-approval-signed-sync-v4]

jobs:
  secret-scan:
    name: Scan tracked source for high-confidence secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan without printing matched values
        shell: bash
        run: |
          set -euo pipefail
          pattern='(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|postgres(ql)?://[^[:space:]@]+:[^[:space:]@]{16,}@|[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][[:space:]]*[:=][[:space:]]*[A-Za-z0-9_./+=-]{16,}|(SUPABASE_SERVICE_ROLE_KEY|RENDER_DB_PASSWORD|R2_SECRET_ACCESS_KEY)[[:space:]]*=[[:space:]]*[A-Za-z0-9_./+=-]{16,})'
          all_matches="$(git grep -nI -E "$pattern" -- . ':!**/*.lock' || true)"
          # Ignore only known non-secret placeholders and test fixture credentials.
          matches="$(printf '%s\\n' "$all_matches" | grep -viE 'REPLACE_WITH_|change-me|postgres://x|maintenance_test_pw|admin_test_password|enrollment_test_password|sync_app_test_password|test-maintenance-password|test-only-hmac-key-long-enough' || true)"
          if [[ -n "$matches" ]]; then
            echo "::error::Potential secret-like value found. Matched values are suppressed; locations only:"
            printf '%s\n' "$matches" | cut -d: -f1,2 | sort -u
            exit 1
          fi
          echo "No high-confidence secret patterns found (known placeholders and test fixture credentials excluded)."

  workflow-validation:
    name: Validate workflows and migration shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Lint GitHub Actions workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Check migration shell syntax
        run: sh -n scripts/migrate.sh

  test:
    name: Typecheck + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PostgreSQL client for migration-runner tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Integration tests
        run: npx vitest run --reporter=verbose
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: '*.txt'
          if-no-files-found: ignore

  docker-build:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sync-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - node runs in the image
        run: docker run --rm sync-engine:ci node -e "console.log('node ok')"

      # The container must refuse to start without DATABASE_URL: this
      # proves the entrypoint (dist/main.js) is wired and reaches the
      # boot guards. If the run exits 0, either the guard is gone or
      # the entrypoint was replaced by something that swallows the
      # error.
      - name: Smoke test - the entrypoint reaches the boot guards
        run: |
          set +e
          output=$(docker run --rm sync-engine:ci node dist/main.js 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ $status -eq 0 ]; then
            echo "::error::expected a non-zero exit without DATABASE_URL"
            exit 1
          fi
          if ! echo "$output" | grep -q "DATABASE_URL"; then
            echo "::error::entrypoint did not reach the boot guards"
            exit 1
          fi
