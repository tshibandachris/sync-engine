name: Scheduled database and object-storage maintenance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eden-sync-engine-maintenance
  cancel-in-progress: false

jobs:
  purge:
    if: github.ref == 'refs/heads/main'
    name: Run tenant-scoped maintenance purge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAINTENANCE_DATABASE_URL: ${{ secrets.RENDER_MAINTENANCE_DATABASE_URL }}
      S3_BUCKET: ${{ secrets.R2_BUCKET }}
      S3_REGION: auto
      S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      MAINTENANCE_DEADLINE_MS: "3300000"
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Validate maintenance secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in MAINTENANCE_DATABASE_URL S3_BUCKET S3_ENDPOINT S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret for $name"
              exit 1
            fi
          done
          if [[ "$MAINTENANCE_DATABASE_URL" != *"sslmode=require"* && "$MAINTENANCE_DATABASE_URL" != *"sslmode=verify-full"* ]]; then
            echo "::error::Render PostgreSQL connection must enforce TLS (sslmode=require or verify-full)."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run maintenance purge with the dedicated database role
        run: npm run maintenance:purge
