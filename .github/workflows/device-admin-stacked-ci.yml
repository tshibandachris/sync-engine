name: Device admin stacked PR validation

on:
  pull_request:
    branches: [validation/full-device-approval-signed-sync-v4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-migrations:
    name: Apply all SQL migrations on PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sync_engine_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sync_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply every migration in order
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: sync_engine_test
        run: |
          set -euo pipefail
          for file in migrations/*.sql; do
            echo "Applying $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

  server-tests:
    name: TypeScript and PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Server and Testcontainers integration tests
        run: npm test -- --reporter=verbose
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
